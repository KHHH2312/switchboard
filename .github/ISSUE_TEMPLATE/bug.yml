name: Bug report
description: Something in Switchboard does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste tokens, cookies, or credential files.**
        Redact emails and paths before posting screenshots.
  - type: input
    id: version
    attributes: { label: Switchboard version, placeholder: "1.1.0" }
    validations: { required: true }
  - type: dropdown
    id: client
    attributes:
      label: Client
      options: [Antigravity, ChatGPT · Codex, Claude Code, Qoder, Cursor, App itself]
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Steps, expected vs actual. Screenshots welcome after redacting." }
    validations: { required: true }
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I did not include credentials, tokens, or unredacted personal data.
          required: true
